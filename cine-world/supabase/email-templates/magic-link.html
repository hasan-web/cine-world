<!--
  Paste into: Supabase Dashboard -> Authentication -> Emails -> Templates -> Magic Link
  Subject: Your Constellation sign-in link
  Uses Supabase's default {{ .ConfirmationURL }} — the app's /auth/confirm route already
  handles both this (PKCE code) and token_hash+type shapes defensively.
-->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Constellation</title>
  </head>
  <body style="margin:0; padding:32px 16px; background:#f2e9d3; font-family:'Libre Baskerville', Georgia, 'Times New Roman', serif;">
    <span style="display:none; font-size:1px; color:#f2e9d3; line-height:1px; max-height:0; max-width:0; opacity:0; overflow:hidden;">Your link back into Constellation.</span>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px; margin:0 auto; background:#e8dcc0; border:1px solid rgba(43,32,24,0.14);">
      <tr>
        <td style="padding:40px 36px; text-align:center;">
          <div style="font-family:'Jost', Helvetica, Arial, sans-serif; font-size:11px; letter-spacing:3px; color:#6b2027; text-transform:uppercase;">Constellation</div>
          <div style="width:36px; height:1px; background:#a97c2f; margin:16px auto;"></div>
          <div style="font-family:'Libre Baskerville', Georgia, 'Times New Roman', serif; font-style:italic; font-size:20px; color:#2b2018; margin-bottom:16px;">your way back in</div>
          <div style="font-family:'Libre Baskerville', Georgia, 'Times New Roman', serif; font-size:14px; line-height:1.7; color:#5a4d3e; text-align:left;">
            One click and you&rsquo;re back at your collection. This link is only good once, and only for a little while.
          </div>
          <div style="margin-top:28px;">
            <a href="{{ .ConfirmationURL }}" style="display:inline-block; border:1px solid #a97c2f; padding:12px 28px; color:#6b2027; text-decoration:none; font-family:'Jost', Helvetica, Arial, sans-serif; font-size:11px; letter-spacing:1.5px; text-transform:uppercase;">Sign in →</a>
          </div>
        </td>
      </tr>
    </table>
    <div style="max-width:480px; margin:16px auto 0; text-align:center; font-family:'JetBrains Mono', 'Courier New', Courier, monospace; font-size:10px; letter-spacing:0.5px; color:#5a4d3e; text-transform:uppercase;">
      a keepsake program for what you&rsquo;ve watched
    </div>
  </body>
</html>
